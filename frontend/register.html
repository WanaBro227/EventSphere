
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | EventSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="index.html">EventSphere</a>
        <a href="login.html" class="btn btn-outline-primary">Sign In</a>
    </div>
</nav>

<main class="auth-section">
    <div class="auth-card">
        <div class="auth-logo">EventSphere</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-description">Join EventSphere and discover exciting events.</p>

        <div id="message-container"></div>

        <form id="register-form" class="auth-form">
            <label class="form-label" for="full-name">Full Name</label>
            <input type="text" id="full-name" class="form-control"
                   minlength="2" maxlength="100" autocomplete="name" required>

            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-control"
                   autocomplete="email" required>

            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-control"
                   minlength="8" maxlength="128" autocomplete="new-password" required>

            <label class="form-label" for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" class="form-control"
                   minlength="8" maxlength="128" autocomplete="new-password" required>

            <button type="submit" id="register-button" class="btn btn-primary auth-submit">
                Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/navigation.js"></script>
</body>
</html>
