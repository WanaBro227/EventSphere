
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard | EventSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="index.html">EventSphere</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                <li class="nav-item"><a class="nav-link" href="my-tickets.html">My Tickets</a></li>
                <li class="nav-item"><a class="nav-link" href="waitlist.html">Waitlist</a></li>
                <li class="nav-item"><a class="nav-link" href="venue-hire.html">Venue Hire</a></li>
                <li class="nav-item"><button class="btn btn-outline-primary" data-logout>Logout</button></li>
            </ul>
        </div>
    </div>
</nav>

<section class="container dashboard-header">
    <h1>Welcome, <span data-user-name>Attendee</span></h1>
    <p class="text-muted-custom">Manage your EventSphere activities.</p>
</section>

<section class="container pb-5">
    <div id="message-container"></div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="dashboard-card">
                <div class="card-label">My Bookings</div>
                <div class="card-value" id="booking-count">—</div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="dashboard-card">
                <div class="card-label">My Tickets</div>
                <div class="card-value" id="ticket-count">—</div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="dashboard-card">
                <div class="card-label">Waitlist Entries</div>
                <div class="card-value" id="waitlist-count">—</div>
            </div>
        </div>
    </div>

    <div class="dashboard-section">
        <div class="dashboard-section-header">
            <h3>Recent Bookings</h3>
            <a href="my-tickets.html" class="btn btn-outline-primary">My Tickets</a>
        </div>

        <div class="dashboard-table table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>Reference</th>
                        <th>Event</th>
                        <th>Quantity</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="recent-bookings">
                    <tr><td colspan="4" class="text-center">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="dashboard-section">
        <div class="dashboard-section-header">
            <h3>Notifications</h3>
        </div>
        <div class="custom-card" id="notification-list">
            <div class="loading">Loading notifications...</div>
        </div>
    </div>
</section>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/navigation.js"></script>
<script src="js/notifications.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
