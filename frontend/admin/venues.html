
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Venues | EventSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<nav class="navbar">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="dashboard.html">EventSphere Admin</a>
        <button class="btn btn-outline-primary" data-logout>Logout</button>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <aside class="col-lg-2 admin-sidebar">
            <div class="sidebar-brand">Administration</div>
            <a href="dashboard.html">Dashboard</a>
            <a class="active" href="venues.html">Venues</a>
            <a href="events.html">Events</a>
            <a href="bookings.html">Bookings</a>
            <a href="venue-hire-requests.html">Venue Hire Requests</a>
            <a href="agent-monitor.html">Agent Monitor</a>
            <a href="../index.html">View Website</a>
        </aside>

        <main class="col-lg-10 admin-content">
            <h1>Venue Management</h1>
            <p class="text-muted-custom">Create and view event venues.</p>

            <div id="message-container"></div>

            <div class="custom-card p-4 mt-4">
                <h4>Add New Venue</h4>

                <form id="admin-venue-form">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="venue-name">Venue Name</label>
                            <input type="text" id="venue-name" class="form-control"
                                   maxlength="150" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="venue-city">City</label>
                            <input type="text" id="venue-city" class="form-control"
                                   required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="venue-address">Address</label>
                            <input type="text" id="venue-address" class="form-control"
                                   required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="venue-capacity">Capacity</label>
                            <input type="number" id="venue-capacity" class="form-control"
                                   min="1" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label" for="venue-description">Description</label>
                            <textarea id="venue-description" class="form-control"
                                      rows="3"></textarea>
                        </div>

                        <div class="col-12">
                            <label class="form-label" for="venue-image">Image URL</label>
                            <input type="url" id="venue-image" class="form-control">
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">
                                Create Venue
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="dashboard-section">
                <h3>Existing Venues</h3>
                <div class="dashboard-table table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>City</th>
                                <th>Capacity</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="admin-venues-list">
                            <tr><td colspan="5" class="text-center">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
