
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Monitor | EventSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<nav class="navbar">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="dashboard.html">EventSphere Admin</a>
        <button class="btn btn-outline-primary" data-logout>Logout</button>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <aside class="col-lg-2 admin-sidebar">
            <div class="sidebar-brand">Administration</div>
            <a href="dashboard.html">Dashboard</a>
            <a href="venues.html">Venues</a>
            <a href="events.html">Events</a>
            <a href="bookings.html">Bookings</a>
            <a href="venue-hire-requests.html">Venue Hire Requests</a>
            <a class="active" href="agent-monitor.html">Agent Monitor</a>
            <a href="../index.html">View Website</a>
        </aside>

        <main class="col-lg-10 admin-content">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div>
                    <h1>Agent Monitor</h1>
                    <p class="text-muted-custom">
                        Monitor messages exchanged between EventSphere agents.
                    </p>
                </div>

                <button id="refresh-agent-logs" class="btn btn-primary">
                    Refresh Logs
                </button>
            </div>

            <div id="message-container"></div>

            <div class="dashboard-table table-responsive mt-4">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Message ID</th>
                            <th>Sender</th>
                            <th>Receiver</th>
                            <th>Performative</th>
                            <th>Conversation ID</th>
                            <th>Status</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody id="agent-logs-list">
                        <tr><td colspan="7" class="text-center">Loading logs...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
