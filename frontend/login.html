
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login | EventSphere</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/auth.css">
        <link rel="stylesheet" href="css/responsive.css">
    </head>
    <body>

    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">EventSphere</a>
            <a href="register.html" class="btn btn-outline-primary">Create Account</a>
        </div>
    </nav>

    <main class="auth-section">
        <div class="auth-card">
            <div class="auth-logo">EventSphere</div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-description">Sign in to manage your bookings and tickets.</p>

            <div id="message-container"></div>

            <form id="login-form" class="auth-form">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" class="form-control"
                    placeholder="Enter your email" autocomplete="email" required>

                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control"
                    placeholder="Enter your password" autocomplete="current-password" required>

                <button type="submit" id="login-button" class="btn btn-primary auth-submit">
                    Sign In
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Register</a>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navigation.js"></script>
    </body>
    </html>
