
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waitlist | EventSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="index.html">EventSphere</a>
        <a href="dashboard.html" class="btn btn-outline-primary">Dashboard</a>
    </div>
</nav>

<section class="section">
    <div class="container">
        <div class="section-heading">
            <h2>Join the Waitlist</h2>
            <p>Join a waitlist when tickets are unavailable.</p>
        </div>

        <div id="message-container"></div>

        <div class="row g-4">
            <div class="col-lg-5">
                <div class="custom-card p-4">
                    <h4>Join Waitlist</h4>

                    <form id="waitlist-form">
                        <div class="mb-3">
                            <label class="form-label" for="waitlist-event-id">Event ID</label>
                            <input type="number" id="waitlist-event-id"
                                   class="form-control" min="1" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="waitlist-category-id">
                                Ticket Category ID
                            </label>
                            <input type="number" id="waitlist-category-id"
                                   class="form-control" min="1" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="waitlist-quantity">Quantity</label>
                            <input type="number" id="waitlist-quantity"
                                   class="form-control" min="1" max="10"
                                   value="1" required>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Join Waitlist
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="custom-card p-4">
                    <h4>My Waitlist Entries</h4>
                    <div id="waitlist-list">
                        <div class="loading">Loading waitlist...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/waitlist.js"></script>
</body>
</html>
