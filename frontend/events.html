
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Events | EventSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/events.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="index.html">EventSphere</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="events.html">Events</a></li>
                <li class="nav-item" data-auth-required hidden><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                <li class="nav-item" data-guest-only><a class="nav-link" href="login.html">Login</a></li>
                <li class="nav-item" data-auth-required hidden><button class="btn btn-outline-primary" data-logout>Logout</button></li>
            </ul>
        </div>
    </div>
</nav>

<section class="events-hero">
    <div class="container">
        <h1>Explore Events</h1>
        <p>Find your next experience with EventSphere.</p>
    </div>
</section>

<section class="section">
    <div class="container">
        <div id="message-container"></div>

        <div class="event-search mb-4">
            <form id="event-search-form" class="row g-3">
                <div class="col-md-9">
                    <input type="search" id="event-search"
                           class="form-control"
                           placeholder="Search events by title or description">
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100" type="submit">Search</button>
                </div>
            </form>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Available Events</h2>
            <button class="btn btn-outline-primary" id="clear-search">Clear Search</button>
        </div>

        <div id="events-list" class="row g-4">
            <div class="loading">Loading events...</div>
        </div>
    </div>
</section>

<footer class="footer">
    <div class="container text-center">
        <p>&copy; <span data-current-year></span> EventSphere</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/navigation.js"></script>
<script src="js/events.js"></script>
</body>
</html>
