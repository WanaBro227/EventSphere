
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Ticket Scanner | EventSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/scanner.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="../index.html">EventSphere Staff</a>
        <button class="btn btn-outline-primary" data-logout id="logout-button">Logout</button>
    </div>
</nav>

<main class="container scanner-container">
    <div class="scanner-card">
        <div class="scanner-title">
            <h2>Event Ticket Check-in</h2>
            <p class="text-muted-custom">
                Validate attendee tickets at the event entrance.
            </p>
        </div>

        <div id="message-container"></div>

        <form id="scanner-form">
            <label class="form-label" for="ticket-code">Ticket Code</label>
            <input type="text" id="ticket-code"
                   class="form-control scanner-input"
                   placeholder="Enter ticket code"
                   required>

            <button type="submit" id="scan-button"
                    class="btn btn-primary w-100 mt-3">
                Validate Ticket
            </button>
        </form>

        <div id="scanner-result" class="scanner-result"></div>
    </div>
</main>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/scanner.js"></script>
</body>
</html>
