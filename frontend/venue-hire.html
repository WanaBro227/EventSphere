
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venue Hire | EventSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="index.html">EventSphere</a>
        <a href="dashboard.html" class="btn btn-outline-primary">Dashboard</a>
    </div>
</nav>

<section class="section">
    <div class="container">
        <div class="section-heading">
            <h2>Hire a Venue</h2>
            <p>Submit a venue hire request for your next event.</p>
        </div>

        <div id="message-container"></div>

        <div class="row g-4">
            <div class="col-lg-7">
                <div class="custom-card p-4">
                    <form id="venue-hire-form">
                        <div class="mb-3">
                            <label class="form-label" for="venue-id">Venue ID</label>
                            <input type="number" id="venue-id" class="form-control"
                                   min="1" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="event-title">Event Title</label>
                            <input type="text" id="event-title" class="form-control"
                                   maxlength="200" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="purpose">Purpose</label>
                            <textarea id="purpose" class="form-control"
                                      rows="4" required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="start-datetime">Start</label>
                                <input type="datetime-local" id="start-datetime"
                                       class="form-control" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="end-datetime">End</label>
                                <input type="datetime-local" id="end-datetime"
                                       class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="expected-attendees">
                                Expected Attendees
                            </label>
                            <input type="number" id="expected-attendees"
                                   class="form-control" min="1" required>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Submit Request
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="custom-card p-4">
                    <h4>My Requests</h4>
                    <div id="my-hire-requests">
                        <div class="loading">Loading requests...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/venue-hire.js"></script>
</body>
</html>
