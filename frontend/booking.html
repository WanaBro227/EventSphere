
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tickets | EventSphere</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/events.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="index.html">EventSphere</a>
        <a href="events.html" class="btn btn-outline-primary">Events</a>
    </div>
</nav>

<section class="section">
    <div class="container">
        <div class="section-heading">
            <h2>Book Your Tickets</h2>
            <p>Complete your booking details below.</p>
        </div>

        <div id="message-container"></div>

        <div class="row g-4">
            <div class="col-lg-7">
                <div class="custom-card p-4">
                    <form id="booking-form">
                        <input type="hidden" id="event-id">

                        <div class="mb-3">
                            <label class="form-label" for="ticket-category">
                                Ticket Category ID
                            </label>
                            <input type="number" class="form-control"
                                   id="ticket-category" min="1" required>
                            <small class="text-muted">
                                Enter a category ID provided by the event organiser.
                            </small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="ticket-quantity">
                                Quantity
                            </label>
                            <input type="number" class="form-control"
                                   id="ticket-quantity" min="1" max="10"
                                   value="1" required>
                        </div>

                        <button type="submit" id="booking-button" class="btn btn-primary">
                            Submit Booking
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="custom-card booking-summary">
                    <h4>Booking Information</h4>
                    <p id="booking-event-title">Loading event...</p>
                    <p class="text-muted-custom">
                        Your booking will be processed by the EventSphere
                        booking service.
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
